name: Test PR
on:
  pull_request:
    paths:
      - "sources/**"
      - "templates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/**"
      - ".github/workflows/pr.yaml"

jobs:
  tests:
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_VERSION: 0.3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get changed files
        id: files
        uses: Ana06/get-changed-files@v2.2.0
        with:
          format: json
      - name: Cache rust stuff
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target/
          key: ${{ runner.os }}-cargo3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo3-
      - name: sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-sccache-
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown
      - name: Install build dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache
          if ! command -v aidoku >/dev/null 2>&1; then
            cargo install --git https://github.com/Aidoku/aidoku-rs aidoku-cli
          fi
      - name: Build sources
        run: |
          shopt -s nullglob
          readarray -t TEMP <<< "$(jq -r '.[]' <<<'${{ steps.files.outputs.added_modified }}')"

          # Workspace-level files affect every member, so build all of them.
          DIRS=()
          for f in "${TEMP[@]}"; do
            case "$f" in
              Cargo.toml|Cargo.lock|.cargo/*|scripts/*) DIRS=(sources/*); break ;;
            esac
          done

          if [ ${#DIRS[@]} -eq 0 ]; then
            while IFS= read -r -d $'\0' i; do
              [ -f "$i/Cargo.toml" ] && DIRS+=("$i")
            done < <(printf "%s\n" "${TEMP[@]}" | cut -d'/' -f-2 | sort -u | grep 'sources' | tr '\n' '\0')
          fi

          if [ ${#DIRS[@]} -eq 0 ]; then
            echo "no source packages changed"
          else
            ./scripts/package.sh "${DIRS[@]}"
          fi
      - name: Test if sources are valid
        run: |
          shopt -s nullglob
          PKGS=(sources/*/package.aix)
          [ ${#PKGS[@]} -eq 0 ] || aidoku verify "${PKGS[@]}"
      - name: Flatten packages directory
        if: always()
        run: |
          shopt -s nullglob
          PKGS=(sources/*/package.aix)
          [ ${#PKGS[@]} -eq 0 ] || aidoku build "${PKGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: public/sources/*.aix
          if-no-files-found: ignore
