name: Lint Rust sources
on:
  pull_request:
    paths:
      - "sources/**"
      - "templates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get changed files
        id: files
        uses: Ana06/get-changed-files@v2.2.0
        with:
          format: json
      - name: Cache rust stuff
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target/
          key: ${{ runner.os }}-cargo3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo3-
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy
          target: wasm32-unknown-unknown
      - name: Other dependencies
        run: sudo apt-get install -y moreutils
      - name: Lint sources
        id: lint
        run: |
          shopt -s nullglob

          echo "::group::Linting"
          readarray -t TEMP <<< "$(jq -r '.[]' <<<'${{ steps.files.outputs.added_modified }}')"

          mkdir -p clippy

          # Workspace-level files affect every member, so lint all of them.
          DIRS=()
          for f in "${TEMP[@]}"; do
            case "$f" in
              Cargo.toml|Cargo.lock|.cargo/*|scripts/*) DIRS=(sources/* templates/*); break ;;
            esac
          done

          if [ ${#DIRS[@]} -eq 0 ]; then
            while IFS= read -r -d $'\0' i; do
              DIRS+=("${i%/}")
            done < <(printf "%s\n" "${TEMP[@]}" | cut -d'/' -f-2 | sort -u | grep -E '^(sources|templates)' | tr '\n' '\0')
          fi

          for i in "${DIRS[@]}"; do
            [ -f "$i/Cargo.toml" ] || continue
            # lint one package at a time so each gets exactly the features it declares
            PKG=$(sed -n 's/^name = "\(.*\)"/\1/p' "$i/Cargo.toml" | head -1)
            cargo clippy -p "$PKG" --message-format=json > "clippy/$PKG.json"
            jq -rsf .github/workflows/supporting/annotations.jq "clippy/$PKG.json"
          done
          echo "::endgroup::"

          ANNOTATIONS=(clippy/*.json)
          if [ ${#ANNOTATIONS[@]} -eq 0 ]; then
            echo "nothing to lint"
            exit 0
          fi

          echo "::group::Generating summary"
          jq --arg RUSTC_VERSION "$(rustc --version)" \
             --arg CARGO_VERSION "$(cargo --version)" \
             --arg CLIPPY_VERSION "$(cargo clippy --version)" \
             -srf .github/workflows/supporting/summary.jq "${ANNOTATIONS[@]}" > $GITHUB_STEP_SUMMARY
          echo "::endgroup::"

          echo "::group::Failing this step if clippy generated anything"
          for annotation in "${ANNOTATIONS[@]}"; do
            LINT_COUNT=$(jq -sr 'map(select(.reason == "compiler-message" and .message.code and .message.spans[].is_primary)) | length' $annotation)

            if ! [ "$LINT_COUNT" = "0" ]; then
              exit 1
            fi
          done
          echo "::endgroup::"
