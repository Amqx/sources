[workspace]
resolver = "3"
members = ["sources/*", "templates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.metadata.aidoku]
# Synced across all extensions
min-app-version = "0.9"

[workspace.dependencies]
# Pinned so every source compiles against the same aidoku-rs.
aidoku = { git = "https://github.com/Amqx/aidoku-rs.git", rev = "e1320b0a2e11afb59e4dee374883a2212d325699", version = "0.3.0" }
aidoku-test = { git = "https://github.com/Amqx/aidoku-rs.git", rev = "e1320b0a2e11afb59e4dee374883a2212d325699" }

# All workspaces use shared dependency versions. Members inherit
# and add their own features when necessary.
aes = { version = "0.9.3", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
block-padding = "0.4.2"
cbc = "0.2.1"
chinese-number = { version = "0.8.2", default-features = false, features = ["chinese-to-number"] }
digest = { version = "0.11.3", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hmac = { version = "0.13.0", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = ["alloc"] }
md-5 = { version = "0.11.0", default-features = false }
md5 = { version = "0.8.1", default-features = false }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
paste = "1.0.15"
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
regex = { version = "1.13.1", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
spin = "0.12.3"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
uuid = { version = "1.26.1", default-features = false }

# Source templates (multisrc)
ezmanhwa = { path = "templates/ezmanhwa" }
gigaviewer = { path = "templates/gigaviewer" }
guya = { path = "templates/guya" }
iken = { path = "templates/iken" }
libgroup = { path = "templates/libgroup" }
liliana = { path = "templates/liliana" }
madara = { path = "templates/madara" }
madtheme = { path = "templates/madtheme" }
mangabox = { path = "templates/mangabox" }
mangareader = { path = "templates/mangareader" }
mangathemesia = { path = "templates/mangathemesia" }
mangaworld_template = { path = "templates/mangaworld" }
mmrcms = { path = "templates/mmrcms" }
pizzareader = { path = "templates/pizzareader" }
tukutema = { path = "templates/tukutema" }
vinetheme = { path = "templates/vinetheme" }
wpcomics = { path = "templates/wpcomics" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
